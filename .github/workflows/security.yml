name: Security — Vulnerability Scanning

on:
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Trivy — scan every image that can be built for an Ajenda runtime.
  #
  # The root API image alone is not a sufficient security boundary: worker,
  # migrator, frontend, and optional HubSpot paths have independent final
  # layers.  Keep this list aligned with the Docker build surfaces in Compose.
  # ─────────────────────────────────────────────────────────────────────────
  trivy-image:
    name: Trivy Image Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # The Trivy binary is released through GitHub. Serialise the initial
      # bootstrap so one cached, pinned binary serves the full image matrix
      # rather than seven concurrent release downloads failing together.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
            build_arg: ""
            runtime_contract: api
          - name: compose-api
            dockerfile: deploy/docker/api.Dockerfile
            build_arg: ""
            runtime_contract: api
          - name: worker
            dockerfile: deploy/docker/worker.Dockerfile
            build_arg: ""
            runtime_contract: worker
          - name: migrate
            dockerfile: deploy/docker/migrate.Dockerfile
            build_arg: ""
            runtime_contract: migrate
          - name: frontend
            dockerfile: deploy/docker/frontend.Dockerfile
            build_arg: NGINX_CONF=deploy/nginx/frontend.k8s.conf
            runtime_contract: ""
          - name: hubspot-crm-adapter
            dockerfile: services/hubspot_crm_adapter/Dockerfile
            build_arg: ""
            runtime_contract: hubspot
          - name: hubspot-crm-ingress
            dockerfile: deploy/compose/hubspot-crm-ingress/Dockerfile
            build_arg: ""
            runtime_contract: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} image for scanning
        env:
          IMAGE: ajenda-ai-${{ matrix.name }}:scan-${{ github.sha }}
          BUILD_ARG: ${{ matrix.build_arg }}
        run: |
          args=()
          if [[ -n "$BUILD_ARG" ]]; then
            args+=(--build-arg "$BUILD_ARG")
          fi
          # --no-cache alone does not refresh a locally cached mutable base
          # tag.  Pull first so this gate evaluates the current upstream base
          # image rather than a runner-cache historical artifact.
          docker build --pull --no-cache --file "${{ matrix.dockerfile }}" "${args[@]}" --tag "$IMAGE" .

      - name: Prove Python runtime image contents (${{ matrix.name }})
        if: matrix.runtime_contract != ''
        env:
          IMAGE: ajenda-ai-${{ matrix.name }}:scan-${{ github.sha }}
          RUNTIME_CONTRACT: ${{ matrix.runtime_contract }}
        run: |
          # The Dockerfile text is a drift guard; these checks prove the final
          # image is non-root, has no pip executable/module, and still imports
          # the process-specific serving code as its configured runtime user.
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            test "$(id -u)" = "1000"
            if command -v pip >/dev/null 2>&1; then
              echo "pip executable is present in the final runtime image" >&2
              exit 1
            fi
            if python -c "import pip" >/dev/null 2>&1; then
              echo "pip module is present in the final runtime image" >&2
              exit 1
            fi
          '
          case "$RUNTIME_CONTRACT" in
            api) docker run --rm --entrypoint python "$IMAGE" -c 'import backend.main' ;;
            worker) docker run --rm --entrypoint python "$IMAGE" -c 'import playwright, backend.workers.worker_loop' ;;
            migrate) docker run --rm --entrypoint python "$IMAGE" -c 'import alembic, backend.db.schema_revision' ;;
            hubspot) docker run --rm --entrypoint python "$IMAGE" -c 'import services.hubspot_crm_adapter.main' ;;
            *) echo "Unknown runtime contract: $RUNTIME_CONTRACT" >&2; exit 1 ;;
          esac

      - name: Install pinned Trivy binary
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ajenda-ai-${{ matrix.name }}:scan-${{ github.sha }}
          # Never reuse package-analysis results across identically tagged PR images.
          cache: false
          # Use the separately installed binary cache while retaining fresh
          # vulnerability database analysis for every image.
          skip-setup-trivy: true
          # Persist the scanner metadata and package findings for review; the
          # command still fails closed below on HIGH/CRITICAL vulnerabilities.
          format: json
          output: trivy-${{ matrix.name }}.json
          # Secret scanning is covered by gitleaks; keep Trivy on package CVEs.
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy report (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-${{ matrix.name }}-${{ github.sha }}
          path: trivy-${{ matrix.name }}.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: pip-audit — scan installed Python dependencies for known vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade packaging tooling
        run: python -m pip install --upgrade "pip<26.0.1" setuptools wheel

      - name: Install project dependencies
        run: python -m pip install ".[dev]"

      - name: Export application dependency audit set
        run: |
          python -m pip freeze \
            --exclude ajenda-ai \
            --exclude pip \
            --exclude setuptools \
            --exclude wheel \
            > audit-requirements.txt
          cat audit-requirements.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Show installed packages
        run: python -m pip list

      - name: Run pip-audit against application dependency set
        # PYSEC-2026-1325 (ecdsa Minerva timing): transitive via python-jose; upstream
        # documents side-channels as out of scope with no planned fix. Keep visible in
        # description output via --desc; ignore only narrowly adjudicated advisories
        # so the gate still fails closed on new vulns.
        #
        # CVE-2026-85394 (python-jose DER public-key/HMAC algorithm confusion):
        # upstream has no patched release. Ajenda does not use a mixed HMAC/asymmetric
        # decode allow-list: customer sessions are HS256-only, while JWKS/OIDC paths
        # are RS256/ES256-only. Unit tests assert those algorithm boundaries.
        run: >
          pip-audit -r audit-requirements.txt --desc on
          --ignore-vuln PYSEC-2026-1325
          --ignore-vuln CVE-2026-85394

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: npm-audit — scan frontend dependency graph for known vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────
  npm-audit:
    name: npm-audit Frontend Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run runtime dependency audit
        working-directory: frontend
        # Tailwind/PostCSS are build-time dependencies and are not present in
        # the nginx runtime image. Gate production exposure on the dependency
        # graph that ships in the image; keep the complete development audit
        # visible below without treating a build-tool advisory as a runtime
        # vulnerability.
        run: npm audit --omit=dev

      - name: Report development dependency audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --json > npm-audit-development.json || true

      - name: Upload development dependency audit report
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-development-${{ github.sha }}
          path: frontend/npm-audit-development.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Secret scanning — detect accidentally committed secrets
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
