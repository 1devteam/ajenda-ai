name: Security — Vulnerability Scanning

on:
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Trivy — scan the built Docker image for OS and library CVEs
  # ─────────────────────────────────────────────────────────────────────────
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image for scanning
        run: docker build --no-cache -t "ajenda-ai:scan-${{ github.sha }}" .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ajenda-ai:scan-${{ github.sha }}
          # Never reuse package-analysis results across identically tagged PR images.
          cache: false
          format: table
          # Secret scanning is covered by gitleaks; keep Trivy on package CVEs.
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: pip-audit — scan installed Python dependencies for known vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tooling
        run: python -m pip install --upgrade "pip<26.0.1" setuptools wheel

      - name: Install project dependencies
        run: python -m pip install ".[dev]"

      - name: Export application dependency audit set
        run: |
          python -m pip freeze \
            --exclude ajenda-ai \
            --exclude pip \
            --exclude setuptools \
            --exclude wheel \
            > audit-requirements.txt
          cat audit-requirements.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Show installed packages
        run: python -m pip list

      - name: Run pip-audit against application dependency set
        # PYSEC-2026-1325 (ecdsa Minerva timing): transitive via python-jose; upstream
        # documents side-channels as out of scope with no planned fix. Keep visible in
        # description output via --desc; ignore only narrowly adjudicated advisories
        # so the gate still fails closed on new vulns.
        #
        # CVE-2026-85394 (python-jose DER public-key/HMAC algorithm confusion):
        # upstream has no patched release. Ajenda does not use a mixed HMAC/asymmetric
        # decode allow-list: customer sessions are HS256-only, while JWKS/OIDC paths
        # are RS256/ES256-only. Unit tests assert those algorithm boundaries.
        run: >
          pip-audit -r audit-requirements.txt --desc on
          --ignore-vuln PYSEC-2026-1325
          --ignore-vuln CVE-2026-85394

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: npm-audit — scan frontend dependency graph for known vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────
  npm-audit:
    name: npm-audit Frontend Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run runtime dependency audit
        working-directory: frontend
        # Tailwind/PostCSS are build-time dependencies and are not present in
        # the nginx runtime image. Gate production exposure on the dependency
        # graph that ships in the image; keep the complete development audit
        # visible below without treating a build-tool advisory as a runtime
        # vulnerability.
        run: npm audit --omit=dev

      - name: Report development dependency audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --json > npm-audit-development.json || true

      - name: Upload development dependency audit report
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-development-${{ github.sha }}
          path: frontend/npm-audit-development.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Secret scanning — detect accidentally committed secrets
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
