name: Security — Vulnerability Scanning

on:
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Trivy — scan the built Docker image for OS and library CVEs
  # ─────────────────────────────────────────────────────────────────────────
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image for scanning
        run: docker build -t ajenda-ai:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ajenda-ai:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: pip-audit — scan installed Python dependencies for known vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────
  pip-audit:
    name: pip-audit Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tooling
        run: python -m pip install --upgrade "pip<26.0.1" setuptools wheel

      - name: Install project dependencies
        run: python -m pip install ".[dev]"

      - name: Export application dependency audit set
        run: |
          python -m pip freeze \
            --exclude ajenda-ai \
            --exclude pip \
            --exclude setuptools \
            --exclude wheel \
            > audit-requirements.txt
          cat audit-requirements.txt

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Show installed packages
        run: python -m pip list

      - name: Run pip-audit against application dependency set
        run: pip-audit -r audit-requirements.txt --desc on

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: npm-audit — scan frontend dependency graph for known vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────
  npm-audit:
    name: npm-audit Frontend Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Secret scanning — detect accidentally committed secrets
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
