name: Release — Build & Publish

# Triggers on every merge to main.
# Reads the version from pyproject.toml. Version tags (vX.Y.Z) and matching
# immutable image tags are created only when that tag does not already exist.
# Every main push still publishes mutable :latest and immutable sha-* digests.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Extract the version from pyproject.toml
  # ─────────────────────────────────────────────────────────────────────────
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from pyproject.toml
        id: extract
        run: |
          VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data['project']['version'])
          ")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: ${VERSION}"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Create a git tag for this version (idempotent — skips if exists)
  # ─────────────────────────────────────────────────────────────────────────
  tag:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: write
    outputs:
      created: ${{ steps.create.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create tag if not exists
        id: create
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — version image tags will not be rewritten"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Build and push Docker images to GHCR
  # ─────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [version, tag]
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      migrate_digest: ${{ steps.migrate.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve publish tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG_CREATED: ${{ needs.tag.outputs.created }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          short_sha="${SHORT_SHA:0:7}"
          api_tags="${REGISTRY}/${IMAGE_NAME}:latest,${REGISTRY}/${IMAGE_NAME}:sha-${short_sha}"
          worker_tags="${REGISTRY}/${IMAGE_NAME}-worker:latest,${REGISTRY}/${IMAGE_NAME}-worker:sha-${short_sha}"
          migrate_tags="${REGISTRY}/${IMAGE_NAME}-migrate:latest,${REGISTRY}/${IMAGE_NAME}-migrate:sha-${short_sha}"
          frontend_tags="${REGISTRY}/${IMAGE_NAME}-frontend:latest,${REGISTRY}/${IMAGE_NAME}-frontend:sha-${short_sha}"
          if [[ "${TAG_CREATED}" == "true" ]]; then
            api_tags="${api_tags},${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            worker_tags="${worker_tags},${REGISTRY}/${IMAGE_NAME}-worker:${VERSION}"
            migrate_tags="${migrate_tags},${REGISTRY}/${IMAGE_NAME}-migrate:${VERSION}"
            frontend_tags="${frontend_tags},${REGISTRY}/${IMAGE_NAME}-frontend:${VERSION}"
          fi
          echo "api_tags=${api_tags}" >> "$GITHUB_OUTPUT"
          echo "worker_tags=${worker_tags}" >> "$GITHUB_OUTPUT"
          echo "migrate_tags=${migrate_tags}" >> "$GITHUB_OUTPUT"
          echo "frontend_tags=${frontend_tags}" >> "$GITHUB_OUTPUT"
          echo "API tags: ${api_tags}"

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push worker image
        id: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.worker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push migrate image
        id: migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/migrate.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.migrate_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          push: true
          build-args: |
            NGINX_CONF=deploy/nginx/frontend.k8s.conf
          tags: ${{ steps.tags.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Scan the exact immutable artifacts published above.  Tags are
  # mutable pointers; the Buildx digest is the release identity that must pass
  # the security gate before a GitHub Release is created.
  # ─────────────────────────────────────────────────────────────────────────
  release-image-security:
    name: Scan Published Image Digest (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: docker-publish
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ${{ github.repository }}
            digest: ${{ needs.docker-publish.outputs.api_digest }}
            runtime_contract: api
          - name: worker
            image: ${{ github.repository }}-worker
            digest: ${{ needs.docker-publish.outputs.worker_digest }}
            runtime_contract: worker
          - name: migrate
            image: ${{ github.repository }}-migrate
            digest: ${{ needs.docker-publish.outputs.migrate_digest }}
            runtime_contract: migrate
          - name: frontend
            image: ${{ github.repository }}-frontend
            digest: ${{ needs.docker-publish.outputs.frontend_digest }}
            runtime_contract: ""
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan immutable published image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ matrix.digest }}
          cache: false
          format: json
          output: trivy-release-${{ matrix.name }}.json
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Prove immutable Python runtime contents (${{ matrix.name }})
        if: matrix.runtime_contract != ''
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ matrix.digest }}
          RUNTIME_CONTRACT: ${{ matrix.runtime_contract }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            test "$(id -u)" = "1000"
            if command -v pip >/dev/null 2>&1; then
              echo "pip executable is present in the published runtime image" >&2
              exit 1
            fi
            if python -c "import pip" >/dev/null 2>&1; then
              echo "pip module is present in the published runtime image" >&2
              exit 1
            fi
          '
          case "$RUNTIME_CONTRACT" in
            api) docker run --rm --entrypoint python "$IMAGE" -c 'import backend.main' ;;
            worker) docker run --rm --entrypoint python "$IMAGE" -c 'import playwright, backend.workers.worker_loop' ;;
            migrate) docker run --rm --entrypoint python "$IMAGE" -c 'import alembic, backend.db.schema_revision' ;;
            *) echo "Unknown runtime contract: $RUNTIME_CONTRACT" >&2; exit 1 ;;
          esac

      - name: Upload immutable-image Trivy report (${{ matrix.name }})
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-release-${{ matrix.name }}-${{ github.sha }}
          path: trivy-release-${{ matrix.name }}.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Create a GitHub Release only for newly created version tags
  # ─────────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, tag, docker-publish, release-image-security]
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "Release ${{ needs.version.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
