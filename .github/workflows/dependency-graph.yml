name: Architecture — Canonical Dependency Graph

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "services/**"
      - "frontend/src/**"
      - "alembic/versions/**"
      - "docs/contracts/dependency-graph.overlay.v1.json"
      - "scripts/validation/build_dependency_graph.py"
      - "scripts/validation/graph_function_inventory.py"
      - "scripts/validation/graph_ascii_v2.py"
      - "scripts/validation/graph_source_topology.py"
      - "tests/unit/validation/test_graph_ascii_v2.py"
      - "tests/unit/validation/test_graph_source_topology.py"
      - "scripts/validation/graph_semantic_inventory.py"
      - "scripts/validation/graph_runtime_contract_inventory.py"
      - "scripts/validation/graph_runtime_action_selection_inventory.py"
      - "scripts/validation/graph_runtime_instantiated_applicability.py"
      - "scripts/validation/graph_impact_analysis.py"
      - "scripts/validation/graph_proof_selection.py"
      - "scripts/validation/graph_completeness_audit.py"
      - "scripts/validation/graph_selective_ci.py"
      - "scripts/validation/graph_architecture_decision.py"
      - "scripts/validation/pr_invariant_classifier.py"
      - "tests/unit/validation/test_build_dependency_graph.py"
      - "tests/unit/validation/test_graph_semantic_hardening.py"
      - "tests/unit/validation/test_graph_runtime_contract_inventory.py"
      - "tests/unit/validation/test_graph_runtime_action_selection_inventory.py"
      - "tests/unit/validation/test_graph_runtime_action_selection_integration.py"
      - "tests/unit/validation/test_graph_runtime_instantiated_applicability.py"
      - "tests/unit/validation/test_graph_impact_analysis.py"
      - "tests/unit/validation/test_graph_proof_selection.py"
      - "tests/unit/validation/test_graph_completeness_audit.py"
      - "tests/unit/validation/test_graph_selective_ci.py"
      - "tests/unit/validation/test_graph_architecture_decision.py"
      - ".github/workflows/dependency-graph.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "services/**"
      - "frontend/src/**"
      - "alembic/versions/**"
      - "docs/contracts/dependency-graph.overlay.v1.json"
      - "scripts/validation/build_dependency_graph.py"
      - "scripts/validation/graph_function_inventory.py"
      - "scripts/validation/graph_ascii_v2.py"
      - "scripts/validation/graph_source_topology.py"
      - "tests/unit/validation/test_graph_ascii_v2.py"
      - "tests/unit/validation/test_graph_source_topology.py"
      - "scripts/validation/graph_semantic_inventory.py"
      - "scripts/validation/graph_runtime_contract_inventory.py"
      - "scripts/validation/graph_runtime_action_selection_inventory.py"
      - "scripts/validation/graph_runtime_instantiated_applicability.py"
      - "scripts/validation/graph_impact_analysis.py"
      - "scripts/validation/graph_proof_selection.py"
      - "scripts/validation/graph_completeness_audit.py"
      - "scripts/validation/graph_selective_ci.py"
      - "scripts/validation/graph_architecture_decision.py"
      - "scripts/validation/pr_invariant_classifier.py"
      - "tests/unit/validation/test_build_dependency_graph.py"
      - "tests/unit/validation/test_graph_semantic_hardening.py"
      - "tests/unit/validation/test_graph_runtime_contract_inventory.py"
      - "tests/unit/validation/test_graph_runtime_action_selection_inventory.py"
      - "tests/unit/validation/test_graph_runtime_action_selection_integration.py"
      - "tests/unit/validation/test_graph_runtime_instantiated_applicability.py"
      - "tests/unit/validation/test_graph_impact_analysis.py"
      - "tests/unit/validation/test_graph_proof_selection.py"
      - "tests/unit/validation/test_graph_completeness_audit.py"
      - "tests/unit/validation/test_graph_selective_ci.py"
      - "tests/unit/validation/test_graph_architecture_decision.py"
      - ".github/workflows/dependency-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-graph:
    name: Build canonical architecture graph
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install graph test dependency
        run: python -m pip install pytest

      - name: Build graph
        run: python scripts/validation/build_dependency_graph.py

      - name: Build Ajenda ASCII v2 draft and factual source topology
        run: |
          python scripts/validation/graph_ascii_v2.py \
            --output artifacts/dependency-graph.ascii.v2.txt \
            --preview-lines 24
          python scripts/validation/graph_source_topology.py \
            --output artifacts/graph-source-topology.v1.json \
            --top 25

      - name: Prove Ajenda ASCII v2 and source topology probes
        run: >-
          pytest -q
          tests/unit/validation/test_graph_ascii_v2.py
          tests/unit/validation/test_graph_source_topology.py

      - name: Resolve graph comparison baseline
        id: graph-refs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" && -n "${{ github.event.before }}" ]]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "head_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Prove graph generator, semantic inventories, impact traversal, proof selection, selective compatibility, completeness audit, and decision composition
        run: >-
          pytest -q
          tests/unit/validation/test_build_dependency_graph.py
          tests/unit/validation/test_graph_semantic_hardening.py
          tests/unit/validation/test_graph_runtime_contract_inventory.py
          tests/unit/validation/test_graph_runtime_action_selection_inventory.py
          tests/unit/validation/test_graph_runtime_action_selection_integration.py
          tests/unit/validation/test_graph_impact_analysis.py
          tests/unit/validation/test_graph_proof_selection.py
          tests/unit/validation/test_graph_completeness_audit.py
          tests/unit/validation/test_graph_selective_ci.py
          tests/unit/validation/test_graph_architecture_decision.py

      - name: Analyze change impact
        run: >-
          python scripts/validation/graph_impact_analysis.py
          --base-ref "${{ steps.graph-refs.outputs.base_ref }}"
          --head-ref "${{ steps.graph-refs.outputs.head_ref }}"
          --json
          --output artifacts/graph-impact-report.json

      - name: Select required proof
        run: >-
          python scripts/validation/graph_proof_selection.py
          --impact-report artifacts/graph-impact-report.json
          --json
          --output artifacts/graph-proof-manifest.json

      - name: Audit graph completeness
        run: >-
          python scripts/validation/graph_completeness_audit.py
          --json
          --output artifacts/graph-completeness-report.json

      - name: Compose architecture decision
        run: >-
          python scripts/validation/graph_architecture_decision.py
          --impact-report artifacts/graph-impact-report.json
          --proof-manifest artifacts/graph-proof-manifest.json
          --completeness-report artifacts/graph-completeness-report.json
          --json
          --output artifacts/graph-architecture-decision.json

      - name: Upload graph artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canonical-dependency-graph
          path: |
            docs/architecture/dependency-graph.v1.json
            artifacts/dependency-graph.ascii.v2.txt
            artifacts/graph-source-topology.v1.json
            artifacts/graph-impact-report.json
            artifacts/graph-proof-manifest.json
            artifacts/graph-completeness-report.json
            artifacts/graph-architecture-decision.json
          if-no-files-found: error
