name: Recovery Hardening Validation

on:
  push:
    branches:
      - main
      - validation/recovery-idempotency-hardening
  pull_request:

jobs:
  recovery-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Verify Docker and pre-pull integration fixture images
        run: |
          set -euo pipefail
          docker info >/dev/null
          docker pull testcontainers/ryuk:0.8.1
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker image inspect testcontainers/ryuk:0.8.1 postgres:16-alpine redis:7-alpine >/dev/null

      - name: Run contract operations tests
        run: pytest -q -ra tests/contract/operations

      - name: Run integration operations tests
        run: pytest -q -ra tests/integration/operations

      - name: Run mixed-tenant selective recovery tests
        run: pytest -q -ra tests/integration/runtime/test_mixed_tenant_selective_recovery_real.py

      - name: Run lease recovery tests
        run: pytest -q -ra tests/integration/runtime/test_lease_recovery_real.py
