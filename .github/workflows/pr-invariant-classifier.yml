name: Architecture — PR Invariant Classifier

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: invariant-classifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify architectural blast radius
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Classify changed files and required proofs
        run: python scripts/validation/pr_invariant_classifier.py
