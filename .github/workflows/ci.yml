name: CI — Pull Request Gate

# Runs on every pull request and on direct pushes to main.
# All jobs must pass before a PR can be merged.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  AJENDA_QUEUE_URL: "redis://localhost:6379/0"
  AJENDA_ENV: "test"
  AJENDA_LOG_LEVEL: "WARNING"
  AJENDA_LOG_JSON: "false"
  AJENDA_APP_NAME: "Ajenda AI Test"
  AJENDA_OIDC_ISSUER: ""
  AJENDA_OIDC_AUDIENCE: "ajenda-api"
  AJENDA_QUEUE_ADAPTER: "redis"
  AJENDA_RATE_LIMIT_REQUESTS: "10000"
  AJENDA_RATE_LIMIT_WINDOW_SECONDS: "60"
  AJENDA_REDACT_KEYS: "password,secret,token,api_key,authorization,cookie,set-cookie"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Static analysis — ruff lint + mypy type checking
  # Fast feedback, no infrastructure required.
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff — lint
        run: ruff check backend/ tests/ scripts/validation/

      - name: Ruff — format check
        run: ruff format --check backend/ tests/ scripts/validation/

      - name: Mypy — type check
        run: mypy backend/

      - name: Contract drift sentinel
        run: python scripts/validation/contract_drift_check.py

      - name: Runtime authority inventory sentinel
        run: python scripts/validation/runtime_authority_inventory_check.py

      - name: Migration seed contract sentinel
        run: python scripts/validation/migration_seed_contract_check.py

      - name: Ability rollout contract sentinel
        run: python scripts/validation/ability_rollout_contract_check.py

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend supply-chain audit + production build
  # ─────────────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Unit tests — no infrastructure, parallelized across hosted runner CPUs
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ tests/contract/ tests/deployment/ \
            -v \
            -n auto \
            --dist=loadscope \
            --tb=short \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -m "not integration"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage.xml
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Integration tests — real Postgres + Redis via Docker Testcontainers
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Verify Docker daemon for Testcontainers
        run: docker info

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ \
            -v \
            --tb=short \
            -m "integration and not live" \
            --timeout=60

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Migration safety — verify downgrade/upgrade round-trip
  # Catches migration regressions before they reach production.
  # ─────────────────────────────────────────────────────────────────────────
  migration-safety:
    name: Migration Round-Trip
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start isolated PostgreSQL with an ephemeral credential
        shell: bash
        run: |
          set -euo pipefail
          pg_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$pg_password"
          echo "CI_POSTGRES_PASSWORD=$pg_password" >> "$GITHUB_ENV"
          docker run -d --name ajenda-migration-postgres --rm \
            -e POSTGRES_DB=ajenda_test -e POSTGRES_USER=ajenda_test \
            -e POSTGRES_PASSWORD="$pg_password" -p 5432:5432 postgres:16-alpine
          for attempt in {1..60}; do
            if docker exec ajenda-migration-postgres pg_isready -U ajenda_test -d ajenda_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs ajenda-migration-postgres
          exit 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Bootstrap restricted database identities
        run: |
          export AJENDA_DATABASE_BOOTSTRAP_URL="postgresql://ajenda_test@localhost:5432/ajenda_test"
          export PGPASSWORD="$CI_POSTGRES_PASSWORD"
          export AJENDA_API_DATABASE_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export AJENDA_WORKER_DATABASE_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export AJENDA_ASSURANCE_DATABASE_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export AJENDA_MIGRATOR_DATABASE_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          {
            echo "AJENDA_API_DATABASE_PASSWORD=$AJENDA_API_DATABASE_PASSWORD"
            echo "AJENDA_WORKER_DATABASE_PASSWORD=$AJENDA_WORKER_DATABASE_PASSWORD"
            echo "AJENDA_ASSURANCE_DATABASE_PASSWORD=$AJENDA_ASSURANCE_DATABASE_PASSWORD"
            echo "AJENDA_MIGRATOR_DATABASE_PASSWORD=$AJENDA_MIGRATOR_DATABASE_PASSWORD"
          } >> "$GITHUB_ENV"
          bash deploy/scripts/provision-database-roles.sh

      - name: Upgrade to head
        run: |
          export AJENDA_DATABASE_URL="postgresql+psycopg://ajenda_migrator:${AJENDA_MIGRATOR_DATABASE_PASSWORD}@localhost:5432/ajenda_test"
          alembic upgrade head

      - name: Downgrade to base
        run: |
          export AJENDA_DATABASE_URL="postgresql+psycopg://ajenda_migrator:${AJENDA_MIGRATOR_DATABASE_PASSWORD}@localhost:5432/ajenda_test"
          alembic downgrade base

      - name: Upgrade again (verify idempotency)
        run: |
          export AJENDA_DATABASE_URL="postgresql+psycopg://ajenda_migrator:${AJENDA_MIGRATOR_DATABASE_PASSWORD}@localhost:5432/ajenda_test"
          alembic upgrade head

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Docker build — verify the image builds cleanly
  # Does not push; push is handled by the release workflow.
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
            tag: ajenda-ai-api
            build_args: ""
          - name: worker
            dockerfile: deploy/docker/worker.Dockerfile
            tag: ajenda-ai-worker
            build_args: ""
          - name: migrate
            dockerfile: deploy/docker/migrate.Dockerfile
            tag: ajenda-ai-migrate
            build_args: ""
          - name: frontend
            dockerfile: deploy/docker/frontend.Dockerfile
            tag: ajenda-ai-frontend
            build_args: NGINX_CONF=deploy/nginx/frontend.k8s.conf
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  live-runtime-proof:
    name: Live Runtime Proof
    runs-on: ubuntu-24.04
    needs: [integration-tests, migration-safety, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    env:
      AJENDA_PROOF_TIMEOUT_SECONDS: "120"
      AJENDA_PROOF_POLL_SECONDS: "2"
      AJENDA_PROOF_COMPOSE_ENV_FILE: deploy/compose/.env.prod
      AJENDA_PROOF_COMPOSE_PROJECT_NAME: ajenda-ai
      AJENDA_PROOF_START_SERVICES: "1"
      AJENDA_PROOF_BOOTSTRAP_ROLES: "1"
      AJENDA_OPERATOR_MISSION_PROOF: "1"
      # Deterministic fixture lane proves the deployed queue/worker/artifact
      # path without pretending a fresh tenant has a public-search provider.
      AJENDA_OPERATOR_PROOF_INSTRUCTION: "Find five software development companies in Austin using local fixture data only."
      AJENDA_OPERATOR_PROOF_EXPECTED_PROSPECT_COUNT: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # live-runtime-proof.sh compares HEAD with HEAD^ for its static
          # GRAFT impact artifact; the default shallow checkout has no parent.
          fetch-depth: 0

      - name: Write prod-like Compose environment
        run: |
          python - <<'PY'
          from __future__ import annotations

          from base64 import urlsafe_b64encode
          from pathlib import Path
          from secrets import token_bytes
          from uuid import uuid4

          env_path = Path("deploy/compose/.env.prod")
          worker_tenant_id = uuid4()
          postgres_password = f"ci-{uuid4().hex}"
          # Isolated proof stack: valid, unpredictable key shared by API, worker,
          # and assurance through the same Compose env_file; never use live keys.
          runtime_fernet_key = urlsafe_b64encode(token_bytes(32)).decode("ascii")
          print(f"::add-mask::{runtime_fernet_key}")
          env_path.write_text(
              "\n".join(
                  [
                      f"POSTGRES_PASSWORD={postgres_password}",
                      f"AJENDA_RUNTIME_SECRET_ENCRYPTION_KEY={runtime_fernet_key}",
                      f"AJENDA_API_DATABASE_PASSWORD={postgres_password}-api",
                      f"AJENDA_WORKER_DATABASE_PASSWORD={postgres_password}-worker",
                      f"AJENDA_ASSURANCE_DATABASE_PASSWORD={postgres_password}-assurance",
                      f"AJENDA_MIGRATOR_DATABASE_PASSWORD={postgres_password}-migrator",
                      "AJENDA_DB_POOL_SIZE=10",
                      "AJENDA_DB_MAX_OVERFLOW=20",
                      "AJENDA_DB_POOL_TIMEOUT=30",
                      "AJENDA_DB_POOL_RECYCLE=1800",
                      "AJENDA_QUEUE_ADAPTER=redis",
                      "AJENDA_QUEUE_URL=redis://redis:6379/0",
                      "AJENDA_ENV=staging",
                      "AJENDA_LOG_LEVEL=INFO",
                      "AJENDA_LOG_JSON=false",
                      "AJENDA_APP_NAME=Ajenda AI Live Runtime Proof",
                      "AJENDA_HOST=0.0.0.0",
                      "AJENDA_PORT=8000",
                      "AJENDA_OIDC_ISSUER=http://localhost:8080/realms/ajenda",
                      "AJENDA_OIDC_AUDIENCE=ajenda-api",
                      "AJENDA_OIDC_JWKS_URI=http://localhost:8080/realms/ajenda/protocol/openid-connect/certs",
                      "AJENDA_SIGNUP_EXPOSE_VERIFICATION_TOKEN=true",
                      "AJENDA_WORKER_TENANT_MODE=multi",
                      f"AJENDA_WORKER_TENANT_ID={worker_tenant_id}",
                      "AJENDA_RATE_LIMIT_REQUESTS=10000",
                      "AJENDA_RATE_LIMIT_WINDOW_SECONDS=60",
                      "AJENDA_REDACT_KEYS=password,secret,token,api_key,authorization,cookie,set-cookie",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

      - name: Run live runtime proof
        run: bash deploy/scripts/live-runtime-proof.sh

      - name: Capture compose diagnostics
        if: always()
        run: |
          mkdir -p artifacts/live-runtime-proof
          docker compose -p "$AJENDA_PROOF_COMPOSE_PROJECT_NAME" --env-file "$AJENDA_PROOF_COMPOSE_ENV_FILE" -f deploy/compose/docker-compose.prod.yml ps > artifacts/live-runtime-proof/compose-ps.txt || true
          docker compose -p "$AJENDA_PROOF_COMPOSE_PROJECT_NAME" --env-file "$AJENDA_PROOF_COMPOSE_ENV_FILE" -f deploy/compose/docker-compose.prod.yml logs --no-color --tail=300 > artifacts/live-runtime-proof/compose-logs.txt || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-live-runtime-proof-diagnostics
          path: artifacts/live-runtime-proof
          retention-days: 7

      - name: Stop compose stack
        if: always()
        run: docker compose -p "$AJENDA_PROOF_COMPOSE_PROJECT_NAME" --env-file "$AJENDA_PROOF_COMPOSE_ENV_FILE" -f deploy/compose/docker-compose.prod.yml down --remove-orphans
