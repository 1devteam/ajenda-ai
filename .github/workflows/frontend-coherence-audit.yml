name: Frontend Supply-Chain Coherence Audit

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

concurrency:
  group: frontend-coherence-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-supply-chain-coherence:
    name: Frontend Supply-Chain Coherence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependency graph
        working-directory: frontend
        run: npm audit

      - name: Build frontend
        working-directory: frontend
        run: npm run build
