name: Weekly Coherence Audit

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

concurrency:
  group: coherence-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-contract-coherence:
    name: Code Contract Coherence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff lint
        run: ruff check backend/ tests/ scripts/validation/

      - name: Ruff format check
        run: ruff format --check backend/ tests/ scripts/validation/

      - name: Mypy type check
        run: mypy backend/

      - name: Authority drift sentinel
        run: python scripts/validation/contract_drift_check.py

      - name: Migration seed contract sentinel
        run: python scripts/validation/migration_seed_contract_check.py

      - name: Ability rollout contract sentinel
        run: python scripts/validation/ability_rollout_contract_check.py

      - name: Unit contract and deployment tests
        run: |
          python -m pytest tests/unit/ tests/contract/ tests/deployment/ \
            -v \
            --tb=short \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not integration"

  runtime-integration-coherence:
    name: Runtime Integration Coherence
    runs-on: ubuntu-latest
    needs: code-contract-coherence
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Verify Docker daemon for Testcontainers
        run: docker info

      - name: Integration tests
        run: |
          python -m pytest tests/integration/ \
            -v \
            --tb=short \
            -m "integration" \
            --timeout=60

  migration-contract-coherence:
    name: Migration Contract Coherence
    runs-on: ubuntu-latest
    needs: code-contract-coherence
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Migration contract tests
        run: python -m pytest tests/unit/db/ tests/deployment/ -v --tb=short

      - name: Migration seed contract sentinel
        run: python scripts/validation/migration_seed_contract_check.py

  docker-build-coherence:
    name: Docker Build Coherence
    runs-on: ubuntu-latest
    needs: code-contract-coherence
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ajenda-ai:coherence-audit
