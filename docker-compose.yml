services:
  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NGINX_CONF: deploy/nginx/frontend.compose.conf
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AJENDA_DATABASE_IDENTITY: api
      AJENDA_DATABASE_URL: postgresql+psycopg://ajenda_api:${AJENDA_API_DATABASE_PASSWORD:?AJENDA_API_DATABASE_PASSWORD must be set}@db:5432/ajenda
      # API and worker are separate processes, so the in-memory queue is invalid here.
      AJENDA_QUEUE_ADAPTER: redis
      AJENDA_QUEUE_URL: redis://redis:6379/0
      AJENDA_NETWORK_EGRESS_ALLOW_PRIVATE_DESTINATIONS: "true"
      AJENDA_NETWORK_EGRESS_TLS_VERIFY: "false"
      AJENDA_VECTOR_DB_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/deploy/scripts/readinesscheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      AJENDA_DATABASE_IDENTITY: worker
      AJENDA_DATABASE_URL: postgresql+psycopg://ajenda_worker:${AJENDA_WORKER_DATABASE_PASSWORD:?AJENDA_WORKER_DATABASE_PASSWORD must be set}@db:5432/ajenda
      # Multi-tenant scheduling discovers active tenants instead of polling a stale ID.
      AJENDA_QUEUE_ADAPTER: redis
      AJENDA_QUEUE_URL: redis://redis:6379/0
      AJENDA_WORKER_TENANT_MODE: multi
      AJENDA_WORKER_TENANT_REFRESH_SECONDS: "30"
      AJENDA_NETWORK_EGRESS_ALLOW_PRIVATE_DESTINATIONS: "true"
      AJENDA_NETWORK_EGRESS_TLS_VERIFY: "false"
      AJENDA_VECTOR_DB_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  assurance:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    env_file:
      - .env
    entrypoint: ["sh", "/app/deploy/scripts/start-assurance.sh"]
    environment:
      AJENDA_DATABASE_IDENTITY: assurance
      AJENDA_DATABASE_URL: postgresql+psycopg://ajenda_assurance:${AJENDA_ASSURANCE_DATABASE_PASSWORD:?AJENDA_ASSURANCE_DATABASE_PASSWORD must be set}@db:5432/ajenda
      AJENDA_ASSURANCE_INTERVAL_SECONDS: "${AJENDA_ASSURANCE_INTERVAL_SECONDS:-300}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/migrate.Dockerfile
    env_file:
      - .env
    environment:
      AJENDA_DATABASE_IDENTITY: migrator
      AJENDA_DATABASE_URL: postgresql+psycopg://ajenda_migrator:${AJENDA_MIGRATOR_DATABASE_PASSWORD:?AJENDA_MIGRATOR_DATABASE_PASSWORD must be set}@db:5432/ajenda
      # Colocated vector plane: ephemeral_memory_chunks on the primary Postgres instance.
      AJENDA_VECTOR_DB_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Explicit first-time provisioning only; never a routine migration dependency.
  # Invoke with --profile bootstrap run --rm role-bootstrap when authorized.
  role-bootstrap:
    profiles: ["bootstrap"]
    image: postgres:16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      AJENDA_API_DATABASE_PASSWORD: ${AJENDA_API_DATABASE_PASSWORD:?AJENDA_API_DATABASE_PASSWORD must be set}
      AJENDA_WORKER_DATABASE_PASSWORD: ${AJENDA_WORKER_DATABASE_PASSWORD:?AJENDA_WORKER_DATABASE_PASSWORD must be set}
      AJENDA_ASSURANCE_DATABASE_PASSWORD: ${AJENDA_ASSURANCE_DATABASE_PASSWORD:?AJENDA_ASSURANCE_DATABASE_PASSWORD must be set}
      AJENDA_MIGRATOR_DATABASE_PASSWORD: ${AJENDA_MIGRATOR_DATABASE_PASSWORD:?AJENDA_MIGRATOR_DATABASE_PASSWORD must be set}
    command:
      - sh
      - -ec
      - >-
        psql -h db -U ajenda -d ajenda -v ON_ERROR_STOP=1
        -f /bootstrap/database_role_bootstrap.sql
    volumes:
      - ./deploy/sql/database_role_bootstrap.sql:/bootstrap/database_role_bootstrap.sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ajenda
      POSTGRES_USER: ajenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajenda -d ajenda"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  hubspot-crm-adapter:
    profiles: ["hubspot"]
    build:
      context: .
      dockerfile: services/hubspot_crm_adapter/Dockerfile
    ports:
      - "8088:8080"
    environment:
      HUBSPOT_API_BASE: https://api.hubapi.com
      HUBSPOT_ADAPTER_TIMEOUT_SECONDS: "15"
    restart: unless-stopped

  hubspot-crm-ingress:
    profiles: ["hubspot"]
    build:
      context: .
      dockerfile: deploy/compose/hubspot-crm-ingress/Dockerfile
    ports:
      - "8443:443"
    depends_on:
      hubspot-crm-adapter:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
