services:
  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        NGINX_CONF: deploy/nginx/frontend.compose.conf
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # API and worker are separate processes, so the in-memory queue is invalid here.
      AJENDA_QUEUE_ADAPTER: redis
      AJENDA_QUEUE_URL: redis://redis:6379/0
      AJENDA_NETWORK_EGRESS_ALLOW_PRIVATE_DESTINATIONS: "true"
      AJENDA_NETWORK_EGRESS_TLS_VERIFY: "false"
      AJENDA_VECTOR_DB_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/deploy/scripts/readinesscheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      # Multi-tenant scheduling discovers active tenants instead of polling a stale ID.
      AJENDA_QUEUE_ADAPTER: redis
      AJENDA_QUEUE_URL: redis://redis:6379/0
      AJENDA_WORKER_TENANT_MODE: multi
      AJENDA_WORKER_TENANT_REFRESH_SECONDS: "30"
      AJENDA_NETWORK_EGRESS_ALLOW_PRIVATE_DESTINATIONS: "true"
      AJENDA_NETWORK_EGRESS_TLS_VERIFY: "false"
      AJENDA_VECTOR_DB_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/migrate.Dockerfile
    env_file:
      - .env
    environment:
      # Colocated vector plane: ephemeral_memory_chunks on the primary Postgres instance.
      AJENDA_VECTOR_DB_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ajenda
      POSTGRES_USER: ajenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajenda -d ajenda"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  hubspot-crm-adapter:
    profiles: ["hubspot"]
    build:
      context: .
      dockerfile: services/hubspot_crm_adapter/Dockerfile
    ports:
      - "8088:8080"
    environment:
      HUBSPOT_API_BASE: https://api.hubapi.com
      HUBSPOT_ADAPTER_TIMEOUT_SECONDS: "15"
    restart: unless-stopped

  hubspot-crm-ingress:
    profiles: ["hubspot"]
    build:
      context: .
      dockerfile: deploy/compose/hubspot-crm-ingress/Dockerfile
    ports:
      - "8443:443"
    depends_on:
      hubspot-crm-adapter:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
