services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AJENDA_HUBSPOT_CRM_ADAPTER_PUBLIC_HOST: hubspot-crm-ingress
      AJENDA_NETWORK_EGRESS_ALLOW_PRIVATE_DESTINATIONS: "true"
      AJENDA_NETWORK_EGRESS_TLS_VERIFY: "false"
      AJENDA_VECTOR_DB_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      AJENDA_HUBSPOT_CRM_ADAPTER_PUBLIC_HOST: hubspot-crm-ingress
      AJENDA_NETWORK_EGRESS_ALLOW_PRIVATE_DESTINATIONS: "true"
      AJENDA_NETWORK_EGRESS_TLS_VERIFY: "false"
      AJENDA_VECTOR_DB_ENABLED: "true"
    depends_on:
      hubspot-crm-ingress:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/migrate.Dockerfile
    env_file:
      - .env
    environment:
      # Colocated vector plane: ephemeral_memory_chunks on the primary Postgres instance.
      AJENDA_VECTOR_DB_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ajenda
      POSTGRES_USER: ajenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajenda -d ajenda"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  hubspot-crm-adapter:
    build:
      context: .
      dockerfile: services/hubspot_crm_adapter/Dockerfile
    ports:
      - "8088:8080"
    environment:
      HUBSPOT_API_BASE: https://api.hubapi.com
      HUBSPOT_ADAPTER_TIMEOUT_SECONDS: "15"
    restart: unless-stopped

  hubspot-crm-ingress:
    build:
      context: .
      dockerfile: deploy/compose/hubspot-crm-ingress/Dockerfile
    volumes:
      - ./deploy/compose/hubspot-crm-ingress/certs:/etc/nginx/certs:ro
    ports:
      - "8443:443"
    depends_on:
      hubspot-crm-adapter:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data: