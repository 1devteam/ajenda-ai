  - id: capability_action_runtime_contract
    area: capability action runtime
    source_of_truth:
      - backend/workers/task_dispatcher.py
      - backend/workers/handlers/tool_invoke.py
      - backend/services/tools/runtime_authority.py
      - backend/services/tools/action_registry.py
      - backend/services/tools/capability_validation.py
      - backend/services/credentials/runtime_authority.py
      - backend/services/credentials/sqlalchemy_repository.py
      - backend/services/credentials/secret_protector.py
      - backend/domain/provider_runtime_credential.py
      - backend/services/security/redaction.py
      - backend/services/abilities/manifest.py
      - backend/services/abilities/catalog.py
      - backend/services/abilities/rollout_validation.py
      - backend/services/tools/evidence_bridge.py
      - backend/services/tools/http_actions.py
      - backend/services/tools/provider_read_actions.py
      - backend/services/tools/webhook_actions.py
      - backend/services/tools/schemas.py
      - backend/services/network_egress.py
      - backend/services/webhook_dispatch.py
      - backend/domain/evidence.py
    route_scope: []
    authority_class: runtime_authoritative
    side_effect_class: tenant_scoped_tool_action_execution
    allowed_side_effects:
      - execute registered in-process actions only after an ExecutionTask has been queued, claimed, and started through worker lease authority
      - persist evidence-shaped action output through the existing task-output lineage path
      - persist completed tool action evidence into tenant-owned EvidenceRecord rows after task-output lineage is appended
      - execute registered actions only when the canonical action has a valid AbilityManifest rollout/proof contract
      - accept credential_reference metadata as non-secret runtime authority input while rejecting raw api_key, token, authorization, bearer, password, secret, private_key, client_secret, and webhook_secret keys in task metadata or tool invocation input
      - resolve credential material only after ToolRuntimeAuthority and capability/ability promotion pass, only through CredentialRuntimeAuthority backed by a live SQLAlchemy credential runtime repository in the worker path, and only when tenant visibility, enabled/non-revoked/non-deleted state, provider/type compatibility, action compatibility, side-effect compatibility, and credential-bound trusted destination metadata pass for credentialed provider egress
      - redact recursively before ActionResult and EvidenceItem payloads leave ActionRegistry so runtime outputs, durable evidence bridge inputs, and operator-visible task results do not contain secret material
      - execute external read/write/send/publish actions only when tenant-visible enabled capability/adapter authority and exact adapter side-effect classification explicitly authorize the concrete canonical action
      - execute side-effecting actions only when versioned invocation metadata and capability or adapter authority explicitly authorize the concrete canonical action
      - validate handler output through ActionResult and EvidenceItem scope checks before dispatcher completion
      - record credential reference metadata such as credential_id/provider/type when needed without persisting runtime secret material
      - execute provider.external_read as the canonical read-only credentialed external provider action for HTTPS GET/HEAD only through exact EXTERNAL_READ adapter promotion, CredentialRuntimeAuthority, strict safe read-only invocation header allowlisting, URL userinfo and credential-bearing query parameter rejection, credential-bound trusted destination host validation before Authorization injection, ActionRegistry, and NetworkEgressAuthority
      - execute http.request as live external egress with GET/HEAD classified as EXTERNAL_READ and HTTP write methods classified as side-effecting EXTERNAL_WRITE without collapsing external read/write/send/publish authority classes
      - constrain runtime HTTP and webhook outbound destinations through shared NetworkEgressAuthority HTTPS-only validation, SSRF protections, fail-closed DNS lookup, and pinned vetted-address connection that preserves TLS SNI and HTTP Host semantics for the original hostname and uses a fresh no-keepalive client with per-request connection close to avoid pooling pinned-IP TLS sessions across hosts
    forbidden_side_effects:
      - execute capabilities directly from declarative capability or adapter records
      - create a parallel dispatcher, queue, lease, capability registry, or adapter registry
      - call WorkerRuntimeService.complete or WorkerRuntimeService.fail from tool actions or providers
      - allow runtime HTTP or webhook egress to reach localhost, .local, obvious internal hostnames, private/link-local/loopback/multicast/reserved/unspecified IP literals, private DNS resolutions, DNS failures, or hostname targets whose validated public DNS answer is not the pinned connection address
      - treat payload-provided http.request allowed_hosts as sufficient sole destination authority without runtime destination-safety enforcement
      - allow invocation-provided provider.external_read allowed_hosts, URL userinfo, credential-bearing query parameters, Cookie headers, custom credential-bearing headers, or credential-like header values to expand or bypass credential-bound trusted destination and runtime credential injection controls
      - treat ability manifests, capability records, adapter records, action registration, credential existence, broad tool.invoke support, or legacy external_side_effect declarations as runtime permission for concrete external or side-effecting actions
      - persist raw API keys, OAuth tokens, bearer tokens, passwords, webhook signing secrets, private keys, or provider credentials in ExecutionTask metadata, ActionResult output, EvidenceItem payloads, task runtime context, logs, operator errors, or docs examples
      - claim OAuth refresh, provider SDK fleet activation, CRM/GTM live writes/sends/publishes, Kubernetes mTLS, cert-manager, service mesh, or production Vault/KMS support from this read-only provider/credential boundary
    required_proofs:
      - tests/unit/tools/test_action_registry.py
      - tests/unit/tools/test_capability_action_validation.py
      - tests/unit/tools/test_tool_runtime_authority.py
      - tests/unit/services/test_credential_runtime_authority.py
      - tests/unit/services/test_sensitive_redaction.py
      - tests/unit/abilities/test_ability_catalog.py
      - tests/unit/abilities/test_ability_manifest_contract.py
      - tests/unit/abilities/test_ability_rollout_validation.py
      - tests/unit/tools/test_http_actions.py
      - tests/unit/tools/test_provider_read_actions.py
      - tests/unit/webhooks/test_webhook_dispatch.py
      - tests/unit/tools/test_evidence_bridge.py
      - tests/unit/workers/test_tool_invoke_handler.py
      - tests/unit/workers/test_task_dispatcher_runtime_contract.py
      - tests/unit/architecture/test_authority_ledger_contract.py
      - scripts/validation/ability_rollout_contract_check.py
      - tests/integration/runtime/test_worker_executes_tool_invoke_task_real.py

