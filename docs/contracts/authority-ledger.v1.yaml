      - /v1/account/provider-credentials/linkedin/oauth/*
      - /v1/account/provider-credentials/salesforce/oauth/*
      - /v1/account/provider-credentials/google-calendar/oauth/*
      - /v1/account/provider-credentials/github/oauth/*
