version: 1
last_reviewed: 2026-05-23
owner: architecture-runtime-governance

notes:
  - "Authority classes: declarative, read_model, governed_mutation, runtime_authoritative."
  - "This ledger is normative for contract intent and must be reconciled against implementation/tests in drift checks."
  - "When a contract changes authority class, update ADRs/tests/validation artifacts in the same workstream."

authority_entries:
  - id: runtime_startup_contract
    area: runtime startup
    source_of_truth:
      - backend/main.py
      - backend/app/config.py
    route_scope: []
    authority_class: runtime_authoritative
    side_effect_class: global_runtime_initialization
    allowed_side_effects:
      - validate runtime configuration
      - initialize database runtime dependencies
      - initialize and ping queue adapter before serving
    forbidden_side_effects:
      - serve requests when required runtime dependencies are unusable
    required_proofs:
      - tests/unit/config/test_runtime_contract_production.py
      - tests/contract/bootstrap/test_app_bootstrap.py

  - id: health_probe_contract
    area: liveness probe
    source_of_truth:
      - backend/api/routes/health.py
    route_scope:
      - /health
      - /v1/system/health
    authority_class: read_model
    side_effect_class: read_only_liveness
    allowed_side_effects:
      - return lightweight liveness status
    forbidden_side_effects:
      - mutate runtime state
      - expose sensitive internals
    required_proofs:
      - tests/contract/api/test_health_route.py
      - tests/contract/api/test_system_status_routes.py

  - id: readiness_probe_contract
    area: readiness probe
    source_of_truth:
      - backend/api/routes/health.py
      - backend/api/routes/system.py
    route_scope:
      - /readiness
      - /v1/system/readiness
    authority_class: read_model
    side_effect_class: dependency_truth_read
    allowed_side_effects:
      - report dependency readiness truth in sanitized form
    forbidden_side_effects:
      - mutate runtime state
      - leak secrets or low-level sensitive failure details
    required_proofs:
      - tests/contract/api/test_system_status_routes.py
      - tests/deployment/test_probe_paths.py

  - id: auth_identity_contract
    area: authenticated principal identity route
    source_of_truth:
      - backend/api/routes/auth.py
      - backend/middleware/auth_context.py
    route_scope:
      - /v1/auth/*
    authority_class: read_model
    side_effect_class: tenant_scoped_identity_read
    allowed_side_effects:
      - return authenticated caller identity claims
    forbidden_side_effects:
      - mutate runtime or tenant state
      - bypass fail-closed authentication
    required_proofs:
      - tests/contract/api/test_auth_routes.py
      - tests/contract/test_auth_contract.py

  - id: api_key_lifecycle_contract
    area: tenant api key lifecycle
    source_of_truth:
      - backend/api/routes/api_keys.py
      - backend/services/api_key_service.py
    route_scope:
      - /v1/api-keys/*
    authority_class: governed_mutation
    side_effect_class: tenant_scoped_credential_mutation
    allowed_side_effects:
      - create and revoke tenant-scoped api keys under authorization and quota checks
    forbidden_side_effects:
      - create cross-tenant credentials
      - bypass authorization or quota enforcement
    required_proofs:
      - tests/contract/api/test_api_key_routes.py
      - tests/integration/auth/test_api_key_lifecycle.py

  - id: mission_intake_contract
    area: mission intake
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/services/mission_executor.py
    route_scope:
      - /v1/missions
    authority_class: governed_mutation
    side_effect_class: tenant_scoped_metadata_create
    allowed_side_effects:
      - create tenant-owned mission records
      - persist mission intake envelope metadata
    forbidden_side_effects:
      - enqueue runtime work directly from intake
      - bypass tenant/auth envelope
    required_proofs:
      - tests/unit/api/test_mission_intake_route.py
      - tests/unit/domain/test_mission_intake_metadata.py

  - id: branch_contract
    area: mission branch management
    source_of_truth:
      - backend/api/routes/branch.py
      - backend/services/branch_manager.py
    route_scope:
      - /v1/branches/*
    authority_class: governed_mutation
    side_effect_class: tenant_scoped_branch_mutation
    allowed_side_effects:
      - create tenant-scoped execution branches for missions
    forbidden_side_effects:
      - mutate cross-tenant branch state
      - bypass tenant envelope
    required_proofs:
      - tests/unit/services/test_mission_runtime_projection.py
      - tests/integration/runtime/test_task_graph_runtime_admission_real.py

  - id: workforce_provisioning_contract
    area: workforce fleet provisioning
    source_of_truth:
      - backend/api/routes/workforce.py
      - backend/services/workforce_provisioner.py
    route_scope:
      - /v1/workforces/*
    authority_class: governed_mutation
    side_effect_class: tenant_scoped_workforce_mutation
    allowed_side_effects:
      - provision tenant-scoped workforce fleet records under quota controls
    forbidden_side_effects:
      - bypass quota checks
      - provision cross-tenant workforce resources
    required_proofs:
      - tests/unit/services/test_mission_runtime_projection.py
      - tests/integration/runtime/test_task_graph_runtime_admission_real.py

  - id: mission_plan_contract
    area: mission planning
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/repositories/mission_plan_repository.py
    route_scope:
      - /v1/missions/{mission_id}/plan
    authority_class: declarative
    side_effect_class: tenant_scoped_plan_contract_mutation
    allowed_side_effects:
      - create or update mission planning contract records
      - validate plan contract shape and status transitions
    forbidden_side_effects:
      - dispatch runtime tasks
      - mutate queue or lease state
    required_proofs:
      - tests/unit/api/test_mission_planning_contract.py
      - tests/unit/repositories/test_mission_plan_repository.py

  - id: mission_task_graph_contract
    area: mission task graph
    source_of_truth:
      - backend/api/routes/mission.py
    route_scope:
      - /v1/missions/{mission_id}/task-graph
    authority_class: declarative
    side_effect_class: tenant_scoped_graph_contract_mutation
    allowed_side_effects:
      - validate and persist normalized graph metadata
      - supersede stale graph-linked contract metadata where defined
    forbidden_side_effects:
      - create execution tasks directly
      - dispatch workers
    required_proofs:
      - tests/unit/domain/test_mission_task_graph_contract_metadata.py
      - tests/contract/api/test_task_graph_runtime_boundary_contract.py

  - id: runtime_admission_readiness_preview_contracts
    area: mission runtime bridge read surfaces
    source_of_truth:
      - backend/api/routes/mission.py
    route_scope:
      - /v1/missions/{mission_id}/runtime-readiness
      - /v1/missions/{mission_id}/runtime-task-preview
      - /v1/missions/{mission_id}/runtime-dispatch-readiness
      - /v1/missions/{mission_id}/worker-dispatch-eligibility
      - /v1/missions/{mission_id}/worker-claim-preview
    authority_class: read_model
    side_effect_class: tenant_scoped_readiness_projection
    allowed_side_effects:
      - aggregate deterministic readiness/preview projections
    forbidden_side_effects:
      - mutate mission/task state
      - enqueue/dispatch runtime work
    required_proofs:
      - tests/unit/api/test_runtime_dispatch_readiness_contract.py
      - tests/unit/api/test_worker_dispatch_eligibility_contract.py

  - id: runtime_task_materialization_readback_contract
    area: runtime task materialization readback
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/repositories/execution_task_repository.py
    route_scope:
      - GET /v1/missions/{mission_id}/runtime-task-materialization
    authority_class: read_model
    side_effect_class: tenant_scoped_materialization_readback
    allowed_side_effects:
      - read current materialization receipts and planned task metadata
    forbidden_side_effects:
      - create execution task rows
      - enqueue queue payloads
      - dispatch workers
      - execute handlers/adapters
    required_proofs:
      - tests/contract/api/test_task_queue_contract.py
      - tests/unit/services/test_mission_runtime_projection.py

  - id: runtime_task_materialization_mutation_contract
    area: runtime task materialization bridge
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/repositories/execution_task_repository.py
    route_scope:
      - POST /v1/missions/{mission_id}/runtime-task-materialization
    authority_class: governed_mutation
    side_effect_class: tenant_scoped_planned_task_creation
    allowed_side_effects:
      - create planned execution task rows from admitted graph preview
      - persist materialization receipts/metadata
    forbidden_side_effects:
      - enqueue queue payloads
      - dispatch workers
      - execute handlers/adapters
    required_proofs:
      - tests/contract/api/test_task_queue_contract.py
      - tests/unit/services/test_mission_runtime_projection.py

  - id: runtime_queue_admission_contract
    area: runtime queue admission bridge
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/services/execution_coordinator.py
      - backend/repositories/execution_task_repository.py
    route_scope:
      - POST /v1/missions/{mission_id}/runtime-queue-admission
    authority_class: runtime_authoritative
    side_effect_class: tenant_scoped_queue_admission_mutation
    allowed_side_effects:
      - enqueue current tenant/mission-owned planned materialized tasks through ExecutionCoordinator
      - persist runtime queue admission receipts and blockers on mission metadata
      - classify already queued materialized tasks as admitted without requeueing
    forbidden_side_effects:
      - create execution task rows
      - dispatch workers or invoke task dispatcher handlers/adapters
      - mutate worker leases or bypass current materialization, quota, tenant, or policy checks
    required_proofs:
      - tests/contract/api/test_mission_queue_contract.py
      - tests/contract/api/test_task_queue_contract.py

  - id: worker_claim_admission_readback_contract
    area: worker claim admission readback
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/services/worker_runtime_service.py
    route_scope:
      - GET /v1/missions/{mission_id}/worker-claim-admission
    authority_class: read_model
    side_effect_class: tenant_scoped_worker_claim_readback
    allowed_side_effects:
      - read current worker claim admission metadata and receipts
    forbidden_side_effects:
      - create worker leases
      - claim tasks
      - start execution
      - dispatch workers
      - execute handlers/adapters
    required_proofs:
      - tests/unit/api/test_worker_claim_admission_contract.py
      - tests/unit/services/test_worker_runtime_service_transaction_contract.py

  - id: worker_claim_admission_mutation_contract
    area: worker claim admission
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/services/worker_runtime_service.py
    route_scope:
      - POST /v1/missions/{mission_id}/worker-claim-admission
    authority_class: governed_mutation
    side_effect_class: tenant_scoped_task_state_transition
    allowed_side_effects:
      - perform bounded queued->claimed transitions
      - establish and validate worker lease ownership contract
    forbidden_side_effects:
      - start execution
      - dispatch workers
      - execute handlers/adapters
      - bypass lease ownership checks
    required_proofs:
      - tests/unit/api/test_worker_claim_admission_contract.py
      - tests/unit/services/test_worker_runtime_service_transaction_contract.py

  - id: worker_start_admission_readback_contract
    area: worker start admission readback
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/services/worker_runtime_service.py
    route_scope:
      - GET /v1/missions/{mission_id}/worker-start-admission
    authority_class: read_model
    side_effect_class: tenant_scoped_worker_start_readback
    allowed_side_effects:
      - read current worker start admission metadata and receipts
    forbidden_side_effects:
      - create worker leases
      - claim tasks
      - start execution
      - dispatch workers
      - execute handlers/adapters
    required_proofs:
      - tests/unit/api/test_worker_start_admission_contract.py
      - tests/unit/services/test_worker_runtime_service_transaction_contract.py

  - id: worker_start_admission_mutation_contract
    area: worker start admission
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/services/worker_runtime_service.py
    route_scope:
      - POST /v1/missions/{mission_id}/worker-start-admission
    authority_class: governed_mutation
    side_effect_class: tenant_scoped_task_state_transition
    allowed_side_effects:
      - perform bounded claimed->running transitions
      - activate and heartbeat validated worker leases
    forbidden_side_effects:
      - dispatch workers
      - execute handlers/adapters
      - enqueue work
      - bypass lease ownership checks
    required_proofs:
      - tests/unit/api/test_worker_start_admission_contract.py
      - tests/unit/services/test_worker_runtime_service_transaction_contract.py

  - id: worker_run_admission_readback_contract
    area: worker run admission readback
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/workers/task_dispatcher.py
      - backend/workers/worker_loop.py
    route_scope:
      - GET /v1/missions/{mission_id}/worker-run-admission
    authority_class: read_model
    side_effect_class: tenant_scoped_worker_run_readback
    allowed_side_effects:
      - read current worker run admission metadata, queue-claim receipts, and run receipts
    forbidden_side_effects:
      - invoke dispatcher
      - claim queue payloads
      - complete/fail/dead-letter tasks
      - mutate runtime state
    required_proofs:
      - tests/unit/api/test_worker_run_admission_contract.py
      - tests/integration/runtime/test_worker_loop_dispatcher_compensation_real.py
      - tests/contract/workers/test_real_worker_loop.py

  - id: worker_run_admission_mutation_contract
    area: worker run admission
    source_of_truth:
      - backend/api/routes/mission.py
      - backend/workers/task_dispatcher.py
      - backend/workers/worker_loop.py
    route_scope:
      - POST /v1/missions/{mission_id}/worker-run-admission
    authority_class: runtime_authoritative
    side_effect_class: tenant_scoped_runtime_dispatch
    allowed_side_effects:
      - invoke dispatcher on admitted running tasks with valid lease ownership
      - complete/fail/dead-letter through canonical runtime paths
    forbidden_side_effects:
      - execute unadmitted tasks
      - bypass queue claim/processing authority
      - bypass tenant/RLS protections
    required_proofs:
      - tests/unit/api/test_worker_run_admission_contract.py
      - tests/integration/runtime/test_worker_loop_dispatcher_compensation_real.py
      - tests/contract/workers/test_real_worker_loop.py

  - id: capability_registry_contract
