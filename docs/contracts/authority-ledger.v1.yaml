version: 1
last_reviewed: 2026-07-31
owner: architecture-runtime-governance

notes:
  - "Authority classes: declarative, read_model, governed_mutation, runtime_authoritative."
  - "This ledger is normative for contract intent and must be reconciled against implementation/tests in drift checks."
  - "When a contract changes authority class, update ADRs/tests/validation artifacts in the same workstream."
  - "Subsystem lane definitions live in docs/product/mission-runtime-architecture-map.md and explain how existing authority entries compose from input to proof; they do not add authority classes or create a competing registry."
  - "Future lane work must map back to these authority_entries, source_of_truth files, and required_proofs before claiming runtime behavior."

authority_entries:
  - id: runtime_startup_contract
    area: runtime startup
    source_of_truth:
      - backend/main.py
      - backend/app/config.py
    route_scope: []
    authority_class: runtime_authoritative
    side_effect_class: global_runtime_initialization
    allowed_side_effects:
      - validate runtime configuration
      - initialize database runtime dependencies
      - initialize and ping queue adapter before serving
    forbidden_side_effects:
      - serve requests when required runtime dependencies are unusable
    required_proofs:
      - tests/unit/config/test_runtime_contract_production.py
      - tests/contract/bootstrap/test_app_bootstrap.py

