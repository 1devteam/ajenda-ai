# DEPRECATED — use deploy/k8s/ingress.yaml instead.
#
# ingress.yaml is the canonical single-host contract:
#   https://<domain>/        → customer frontend (SPA)
#   https://<domain>/v1/*    → API (including Stripe webhook)
#
# This split-host manifest (api.ajenda.ai only, no frontend) predates the
# customer product UI and is retained for migration reference only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ajenda-api-ingress-legacy-split-host
  namespace: ajenda
  labels:
    app: ajenda-api
    component: ingress-legacy
  annotations:
    kubernetes.io/description: "Deprecated — use ajenda-ingress in ingress.yaml"
spec:
  ingressClassName: nginx
  rules: []