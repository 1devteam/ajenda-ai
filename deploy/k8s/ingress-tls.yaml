# Vector 2 — Production TLS Hardening
# Requires cert-manager with a ClusterIssuer named "letsencrypt-production"
# and nginx-ingress-controller deployed in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ajenda-api-ingress
  namespace: ajenda
  labels:
    app: ajenda-api
    version: "1.1.0"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.ajenda.ai
      secretName: ajenda-tls-secret
  rules:
    - host: api.ajenda.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ajenda-api
                port:
                  number: 8000
