# Ajenda AI — Kubernetes Ingress with TLS (cert-manager + Let's Encrypt)
#
# Prerequisites:
#   - cert-manager installed in the cluster
#   - ClusterIssuer "letsencrypt-prod" configured
#   - nginx-ingress-controller deployed
#
# Replace ajenda.example.com with the real domain before deploying.
# The Stripe webhook path /v1/billing/webhook/stripe must be publicly
# reachable for Stripe to deliver events.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ajenda-ingress
  namespace: ajenda
  labels:
    app: ajenda-ai
    component: ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Rate limiting at the ingress layer (defense-in-depth alongside app-layer limits)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Stripe webhook: allow larger body for event payloads
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ajenda.example.com
      secretName: ajenda-tls
  rules:
    - host: ajenda.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ajenda-api
                port:
                  number: 8000
