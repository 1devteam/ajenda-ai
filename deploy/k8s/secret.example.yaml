apiVersion: v1
kind: Secret
metadata:
  name: ajenda-secrets
  namespace: ajenda
type: Opaque
stringData:
  AJENDA_DATABASE_URL: "postgresql+psycopg://ajenda:<REPLACE_POSTGRES_PASSWORD>@postgres:5432/ajenda"
  POSTGRES_PASSWORD: "<REPLACE_POSTGRES_PASSWORD>"
  AJENDA_WEBHOOK_SECRET_ENCRYPTION_KEY: "<REPLACE_FERNET_KEY>"
  AJENDA_WEBHOOK_SECRET_ENCRYPTION_KEY_PREV: ""
  AJENDA_RUNTIME_SECRET_ENCRYPTION_KEY: "<REPLACE_FERNET_KEY>"
  AJENDA_RUNTIME_SECRET_ENCRYPTION_KEY_PREV: ""
  # --- Billing (Stripe) ---
  # Generate values in the Stripe Dashboard API keys screen.
  # Use test-mode values only for non-production environments.
  STRIPE_SECRET_KEY: "<SET_COMPLETE_STRIPE_PRIVATE_API_VALUE>"
  STRIPE_PUBLISHABLE_KEY: "<SET_COMPLETE_STRIPE_PUBLIC_API_VALUE>"
  # Webhook signing value — obtain from the Stripe Dashboard webhook endpoint.
  STRIPE_WEBHOOK_SECRET: "whsec_<REPLACE_STRIPE_WEBHOOK_SECRET>"
  # Price IDs for each paid plan — create in the Stripe Dashboard Products section.
  STRIPE_PRICE_STARTER: "price_<REPLACE_STARTER_PRICE_ID>"
  STRIPE_PRICE_PRO: "price_<REPLACE_PRO_PRICE_ID>"
