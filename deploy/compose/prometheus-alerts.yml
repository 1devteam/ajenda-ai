groups:
  - name: ajenda-readiness-dependencies
    rules:
      - alert: AjendaDatabaseReadinessUnavailable
        expr: ajenda_readiness_dependency_status{dependency="database"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Ajenda database readiness dependency is unavailable.
          description: The database readiness dependency has reported unavailable or has not produced a successful readiness evaluation.

      - alert: AjendaQueueReadinessUnavailable
        expr: ajenda_readiness_dependency_status{dependency="queue"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Ajenda queue readiness dependency is unavailable.
          description: The queue readiness dependency has reported unavailable or has not produced a successful readiness evaluation.

      - alert: AjendaQueueBacklogDetected
        expr: ajenda_queue_depth > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Ajenda queue backlog detected.
          description: Queue depth has exceeded 100 tasks for at least 5 minutes.

      - alert: AjendaDeadLettersPresent
        expr: ajenda_dead_letter_count > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Ajenda dead-letter entries present.
          description: Dead-letter queue contains one or more tasks for at least 2 minutes.

  - name: ajenda-continuous-assurance
    rules:
      - alert: AjendaAssuranceContradictionsPresent
        expr: ajenda_assurance_contradictory_count > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Ajenda continuous assurance found runtime contradictions.
          description: One or more latest mission assurance observations are contradictory.

      - alert: AjendaAssuranceDriftPresent
        expr: ajenda_assurance_drifted_count > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Ajenda continuous assurance found runtime drift.
          description: One or more latest mission assurance observations are drifted.

      - alert: AjendaAssuranceFirstDivergencePresent
        expr: ajenda_assurance_first_divergence_count > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Ajenda continuous assurance recorded first divergence.
          description: At least one latest mission assurance observation contains a first-divergence marker.

