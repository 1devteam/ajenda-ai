# =============================================================================
# Ajenda AI — Local customer UI origin matrix
# =============================================================================
# Two supported local profiles. Pick one and keep browser URL, API env vars,
# and external OAuth callback registrations aligned.
#
# Apply a profile to deploy/compose/.env.prod:
#   bash scripts/dev/sync-local-env.sh --profile vite
#   bash scripts/dev/sync-local-env.sh --profile compose
# =============================================================================

version: 1

# Where to obtain credentials and which env vars to set.
# Run: bash scripts/dev/credentials-setup-guide.sh --profile vite
# Master local secrets: ~/.ajenda/runtime-secrets.env
# Sync into services: bash scripts/dev/sync-local-secrets.sh --bootstrap --recreate-api
runtime_secrets:
  master_file: ~/.ajenda/runtime-secrets.env
  example_file: scripts/dev/runtime-secrets.env.example
  sync_script: scripts/dev/sync-local-secrets.sh
credential_sources:
  google:
    label: Google (OIDC identity login + connector OAuth for Gmail/Calendar/Contacts)
    required_for_local: true
    env_file: deploy/compose/.env.prod
    console:
      credentials: https://console.cloud.google.com/apis/credentials
      consent_screen: https://console.cloud.google.com/apis/credentials/consent
      gmail_api: https://console.cloud.google.com/apis/library/gmail.googleapis.com
      calendar_api: https://console.cloud.google.com/apis/library/calendar-json.googleapis.com
      people_api: https://console.cloud.google.com/apis/library/people.googleapis.com
    env_vars:
      - AJENDA_OIDC_LOGIN_ENABLED
      - AJENDA_OIDC_PROVIDER
      - AJENDA_OIDC_CLIENT_ID
      - AJENDA_OIDC_CLIENT_SECRET
      - AJENDA_GOOGLE_CONNECTOR_CLIENT_ID
      - AJENDA_GOOGLE_CONNECTOR_CLIENT_SECRET
      - AJENDA_OIDC_ISSUER
      - AJENDA_OIDC_JWKS_URI
      - AJENDA_SESSION_SIGNING_SECRET
    cli_env_file: ~/.ajenda/google-cli.env
    cli_env_vars:
      - AJENDA_GOOGLE_CLI_CLIENT_ID
      - AJENDA_GOOGLE_CLI_CLIENT_SECRET
    notes: >
      One Web OAuth client can cover identity login and Connections UI, but scopes and
      redirect URIs must stay separate. Identity login uses openid/email/profile only.
      Connectors use Gmail / Calendar / Contacts scopes via Connections buttons.
      Enable People API for Contacts. CLI/E2E: bash scripts/google/create_cli_oauth_client.sh
  salesforce:
    label: Salesforce (Credentials UI)
    required_for_local: false
    env_file: deploy/compose/.env.prod
    console:
      connected_apps: https://login.salesforce.com/lightning/setup/ConnectedApplication/home
      developer: https://developer.salesforce.com/docs/atlas.en-us.api_rest.meta/api_rest/intro_oauth_and_connected_apps.htm
    env_vars:
      - AJENDA_SALESFORCE_CLIENT_ID
      - AJENDA_SALESFORCE_CLIENT_SECRET
    notes: Create a Connected App with OAuth; paste Consumer Key/Secret into .env.prod.
  hubspot:
    label: HubSpot CRM (platform master key — shared Ajenda portal)
    required_for_local: false
    env_file: deploy/compose/.env.prod
    console:
      private_apps: https://developers.hubspot.com/docs/apps/legacy-apps/private-apps/overview
      create_token: https://app.hubspot.com/private-apps
    env_vars:
      - AJENDA_HUBSPOT_PLATFORM_MASTER_KEY_ENABLED
      - AJENDA_HUBSPOT_PLATFORM_MASTER_KEY
      - AJENDA_HUBSPOT_PLATFORM_MASTER_AUTO_PROVISION
    e2e_env_file: ~/.ajenda/e2e.env
    e2e_env_vars:
      - AJENDA_E2E_HUBSPOT_PAK
    notes: >
      Operator sets one PAK in runtime secrets; all tenants get hubspot-crm auto-provisioned
      (no per-user HubSpot login). Per-tenant PAK remains optional via Credentials UI.
      Bootstrap copies AJENDA_E2E_HUBSPOT_PAK into AJENDA_HUBSPOT_PLATFORM_MASTER_KEY.
  stripe:
    label: Stripe (billing checkout)
    required_for_local: false
    env_file: deploy/compose/.env.prod
    console:
      api_keys: https://dashboard.stripe.com/test/apikeys
      webhooks: https://dashboard.stripe.com/test/webhooks
      products: https://dashboard.stripe.com/test/products
    env_vars:
      - STRIPE_SECRET_KEY
      - STRIPE_PUBLISHABLE_KEY
      - STRIPE_WEBHOOK_SECRET
      - STRIPE_PRICE_STARTER
      - STRIPE_PRICE_PRO
    notes: Run deploy/scripts/stripe-staging-bootstrap.sh to seed test prices locally.
  resend:
    label: Resend (signup verification email)
    required_for_local: false
    env_file: deploy/compose/.env.prod
    console:
      api_keys: https://resend.com/api-keys
    env_vars:
      - AJENDA_RESEND_API_KEY
    notes: Local dev uses AJENDA_EMAIL_PROVIDER=noop; Resend only needed for staging/prod email.
  encryption:
    label: Fernet encryption (webhook + runtime secrets at rest)
    required_for_local: false
    env_file: deploy/compose/.env.prod
    console: {}
    env_vars:
      - AJENDA_WEBHOOK_SECRET_ENCRYPTION_KEY
      - AJENDA_RUNTIME_SECRET_ENCRYPTION_KEY
    generate_cmd: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    notes: Required before storing provider credentials in production-like staging.
  github:
    label: GitHub (Credentials UI — optional)
    required_for_local: false
    enabled: false
    env_file: deploy/compose/.env.prod
    console:
      oauth_apps: https://github.com/settings/developers
    env_vars:
      - AJENDA_GITHUB_CLIENT_ID
      - AJENDA_GITHUB_CLIENT_SECRET
    notes: Not in active use; skip unless enabling GitHub in Credentials UI.

profiles:
  vite:
    label: Vite dev server (hot reload)
    customer_ui_port: 5173
    customer_ui_origin: http://localhost:5173
    api_url: http://localhost:8000
    description: >
      Frontend via `cd frontend && npm run dev` (port 5173). API/worker/db/redis
      from compose or host uvicorn. Vite proxies /v1 to the API.
    env:
      AJENDA_CORS_ALLOWED_ORIGINS: http://localhost:5173
      AJENDA_SIGNUP_VERIFY_URL_BASE: http://localhost:5173/verify-email
      # Identity login (OIDC) — openid/email/profile only; no Gmail/Calendar/Contacts scopes
      AJENDA_OIDC_LOGIN_ENABLED: "true"
      AJENDA_OIDC_PROVIDER: google
      AJENDA_OIDC_ISSUER: https://accounts.google.com
      AJENDA_OIDC_JWKS_URI: https://www.googleapis.com/oauth2/v3/certs
      AJENDA_OIDC_AUDIENCE: ajenda-api
      AJENDA_OIDC_SCOPES: openid email profile
      AJENDA_OIDC_REDIRECT_URI_ALLOWLIST: http://localhost:5173/auth/callback
      # Connector OAuth redirects (Connections UI buttons — separate from identity login)
      AJENDA_GMAIL_OAUTH_REDIRECT_URI: http://localhost:5173/credentials/gmail/callback
      AJENDA_LINKEDIN_OAUTH_REDIRECT_URI: http://localhost:5173/credentials/linkedin/callback
      AJENDA_SALESFORCE_OAUTH_REDIRECT_URI: http://localhost:5173/credentials/salesforce/callback
      AJENDA_GOOGLE_CALENDAR_OAUTH_REDIRECT_URI: http://localhost:5173/credentials/google-calendar/callback
      AJENDA_GOOGLE_CONTACTS_OAUTH_REDIRECT_URI: http://localhost:5173/credentials/google-contacts/callback
      AJENDA_GOOGLE_DOCS_OAUTH_REDIRECT_URI: http://localhost:5173/credentials/google-docs/callback
      AJENDA_GITHUB_OAUTH_REDIRECT_URI: http://localhost:5173/credentials/github/callback
    external_callbacks:
      google_cloud:
        console_url: https://console.cloud.google.com/apis/credentials
        javascript_origins:
          - http://localhost:5173
        redirect_uris:
          - http://localhost:5173/auth/callback
          - http://localhost:5173/credentials/gmail/callback
          - http://localhost:5173/credentials/google-calendar/callback
          - http://localhost:5173/credentials/google-contacts/callback
          - http://localhost:5173/credentials/google-docs/callback
      salesforce:
        console_hint: Connected App → OAuth settings → Callback URL
        callback_urls:
          - http://localhost:5173/credentials/salesforce/callback
      linkedin:
        console_hint: LinkedIn Developer Portal → Auth → Redirect URLs
        redirect_urls:
          - http://localhost:5173/credentials/linkedin/callback
      github:
        console_hint: GitHub OAuth App → Authorization callback URL
        callback_urls:
          - http://localhost:5173/credentials/github/callback

  compose:
    label: Docker Compose prod-like stack (nginx frontend)
    customer_ui_port: 8080
    customer_ui_origin: http://localhost:8080
    api_url: http://localhost:8000
    description: >
      Full stack via `docker compose --env-file deploy/compose/.env.prod
      -f deploy/compose/docker-compose.prod.yml up -d --build`. Customer UI on
      port 8080; API exposed on 8000.
    env:
      AJENDA_CORS_ALLOWED_ORIGINS: http://localhost:8080
      AJENDA_SIGNUP_VERIFY_URL_BASE: http://localhost:8080/verify-email
      # Identity login (OIDC) — openid/email/profile only; no Gmail/Calendar/Contacts scopes
      AJENDA_OIDC_LOGIN_ENABLED: "true"
      AJENDA_OIDC_PROVIDER: google
      AJENDA_OIDC_ISSUER: https://accounts.google.com
      AJENDA_OIDC_JWKS_URI: https://www.googleapis.com/oauth2/v3/certs
      AJENDA_OIDC_AUDIENCE: ajenda-api
      AJENDA_OIDC_SCOPES: openid email profile
      AJENDA_OIDC_REDIRECT_URI_ALLOWLIST: http://localhost:8080/auth/callback
      # Connector OAuth redirects (Connections UI buttons — separate from identity login)
      AJENDA_GMAIL_OAUTH_REDIRECT_URI: http://localhost:8080/credentials/gmail/callback
      AJENDA_LINKEDIN_OAUTH_REDIRECT_URI: http://localhost:8080/credentials/linkedin/callback
      AJENDA_SALESFORCE_OAUTH_REDIRECT_URI: http://localhost:8080/credentials/salesforce/callback
      AJENDA_GOOGLE_CALENDAR_OAUTH_REDIRECT_URI: http://localhost:8080/credentials/google-calendar/callback
      AJENDA_GOOGLE_CONTACTS_OAUTH_REDIRECT_URI: http://localhost:8080/credentials/google-contacts/callback
      AJENDA_GOOGLE_DOCS_OAUTH_REDIRECT_URI: http://localhost:8080/credentials/google-docs/callback
      AJENDA_GITHUB_OAUTH_REDIRECT_URI: http://localhost:8080/credentials/github/callback
    external_callbacks:
      google_cloud:
        console_url: https://console.cloud.google.com/apis/credentials
        javascript_origins:
          - http://localhost:8080
        redirect_uris:
          - http://localhost:8080/auth/callback
          - http://localhost:8080/credentials/gmail/callback
          - http://localhost:8080/credentials/google-calendar/callback
          - http://localhost:8080/credentials/google-contacts/callback
          - http://localhost:8080/credentials/google-docs/callback
      salesforce:
        console_hint: Connected App → OAuth settings → Callback URL
        callback_urls:
          - http://localhost:8080/credentials/salesforce/callback
      linkedin:
        console_hint: LinkedIn Developer Portal → Auth → Redirect URLs
        redirect_urls:
          - http://localhost:8080/credentials/linkedin/callback
      github:
        console_hint: GitHub OAuth App → Authorization callback URL
        callback_urls:
          - http://localhost:8080/credentials/github/callback
