[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ajenda-ai"
version = "1.2.0"
description = "Ajenda AI — Production-grade governed-runtime backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # FastAPI 0.136+ changed router include internals in a way that exposes
  # _IncludedRouter placeholders to route-inventory contract tests. Keep the
  # application on the proven route-flattening contract until bootstrap code is
  # explicitly adapted and contract-tested for the newer behavior.
  "fastapi>=0.115,<0.143",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-json-logger>=2.0,<5.0",
  # Auth — cryptographic hashing and JWT verification
  "argon2-cffi>=25.1.0,<26.0",
  "python-jose[cryptography]>=3.3.0,<4.0",
  "httpx>=0.27,<1.0",
  # Queue
  "redis>=5.0,<9.0",
  # Billing
  "stripe>=10.0,<16.0",
  # Onboarding email canonicalization
  "email-validator>=2.0,<3.0",
  # Public search discovery (web.research / ddgs chain)
  "ddgs>=9.0,<10.0",
  # Governed browser execution; the worker image installs the pinned Chromium binary.
  "playwright==1.63.0",
  # Security floor: GHSA-6v7p-g79w-8964 is fixed in msgpack 1.2.1.
  "msgpack>=1.2.1,<2.0",

  # Observability
  "prometheus-client>=0.20,<1.0",
  "opentelemetry-sdk>=1.24,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=0.26.0,<2.0",
  "pytest-cov>=5.0,<8.0",
  "freezegun>=1.4,<2.0",
  "httpx>=0.27,<1.0",
  "anyio>=4.4,<5.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<3.0",
  "pytest-timeout>=2.3,<3.0",
  # Integration test infrastructure — real Postgres and Redis containers
  "docker>=7.0,<8.0",
  "testcontainers[postgres,redis]>=4.8,<5.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q -ra"
testpaths = ["tests"]
filterwarnings = [
  "ignore:datetime.datetime.utcnow\\(\\) is deprecated.*:DeprecationWarning",
]
markers = [
  "integration: marks tests as integration tests requiring Docker/Testcontainers (deselect with -m 'not integration')",
  "live: marks integration tests that require configured external provider credentials and network access",
  "unit: marks tests as unit tests (no external dependencies required)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = [
  "N818",   # Exception names don't need Error suffix
  "B008",   # FastAPI Depends() in function signatures is the canonical pattern
  "UP046",  # Generic[T] subclass syntax — Python 3.12 type params not yet universal
  "E501",   # Line length — enforced by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["E741", "B007", "B905", "RUF005"]  # Visualization scripts — not production code
"tests/**" = ["RUF059", "B017", "RUF012"]       # Test helpers — mock unpacking patterns are intentional

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["backend"]
[[tool.mypy.overrides]]
module = ["jose", "jose.*", "playwright", "playwright.*", "duckduckgo_search", "duckduckgo_search.*", "ddgs", "ddgs.*"]
ignore_missing_imports = true
